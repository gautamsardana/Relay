version: "2"

sql:
  - schema: "internal/migrations"
    queries: "internal/store/queries"
    engine: "postgresql"
    gen:
      go:
        out: "internal/store/sqlc"
        package: "sqlc"
        emit_json_tags: true
        overrides:
          - db_type: "run_status"
            go_type:
              import: "github.com/gautamsardana/relay/internal/models"
              package: "models"
              type: "RunStatus"
          - db_type: "step_status"
            go_type:
              import: "github.com/gautamsardana/relay/internal/models"
              package: "models"
              type: "StepStatus"
          - db_type: "uuid"
            go_type:
              import: ""
              package: ""
              type: "string"